<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Summarizer — Upload</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Meeting Summarizer</h1>
      <nav class="modes">
        <a href="/asr">Realtime</a>
        <a href="/upload" class="active">Upload</a>
      </nav>
    </header>

    <div class="controls">
      <input type="file" id="file" accept="audio/*">
      <button id="submit">ถอดเสียงและสรุป</button>
      <span class="status" id="status"></span>
    </div>

    <h2>ถอดเสียง</h2>
    <div id="transcript" class="panel empty">ยังไม่มีข้อมูล</div>

    <h2>สรุป</h2>
    <div id="summary" class="panel empty">ยังไม่มีข้อมูล</div>
  </div>
  <script src="/static/upload.js"></script>
</body>
</html>
